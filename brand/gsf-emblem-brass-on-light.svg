  <g fill="#9A6E22">
    <polygon points="50,50 33,13 50,30 67,13"/>
    <polygon points="50,50 33,13 50,30 67,13" transform="rotate(90 50 50)"/>
    <polygon points="50,50 33,13 50,30 67,13" transform="rotate(180 50 50)"/>
    <polygon points="50,50 33,13 50,30 67,13" transform="rotate(270 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="7.5" fill="#F3EFE6" stroke="#9A6E22" stroke-width="2.5"/>
</svg>
